<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sixtyvpn</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <header class="header">
        <div>
            <p class="small-text">خوش آمدید</p>
            <h2 id="username">کاربر تلگرام</h2>
        </div>

        <div class="avatar" id="avatar">👤</div>
    </header>


    <!-- HOME -->
    <section id="homePage">

        <section class="subscription-card">

            <div class="status-row">
                <span>وضعیت سرویس</span>
                <span class="status active" id="serviceStatus">
                    بررسی...
                </span>
            </div>

            <h1>sixtyvpn</h1>

            <div class="info-grid">

                <div>
                    <span>موجودی</span>
                    <strong id="balance">0</strong>
                </div>

                <div>
                    <span>سرویس فعال</span>
                    <strong id="activeServices">0</strong>
                </div>

            </div>

            <button
                class="main-button"
                onclick="showConnection()">
                دریافت اتصال
            </button>

        </section>


        <h3 class="section-title">
            خرید سرویس
        </h3>

        <section
            class="plans"
            id="plans">

            <div class="plan">
                <h3>در حال دریافت پلن‌ها...</h3>
            </div>

        </section>

    </section>


    <!-- SERVICES -->
    <section
        id="servicesPage"
        class="hidden">

        <h3 class="section-title">
            سرویس‌های من
        </h3>

        <section
            class="plans"
            id="servicesList">

            <div class="plan">
                <h3>در حال دریافت...</h3>
            </div>

        </section>

    </section>


    <!-- ACCOUNT -->
    <section
        id="accountPage"
        class="hidden">

        <h3 class="section-title">
            حساب کاربری
        </h3>

        <section class="plan">

            <h3 id="accountName">
                کاربر تلگرام
            </h3>

            <div class="plan-info">

                <span>
                    موجودی
                </span>

                <span id="accountBalance">
                    0
                </span>

            </div>

            <div class="plan-info">

                <span>
                    سرویس فعال
                </span>

                <span id="accountServices">
                    0
                </span>

            </div>

        </section>


        <h3 class="section-title">
            سفارش‌های اخیر
        </h3>

        <section
            class="plans"
            id="ordersList">

            <div class="plan">
                <h3>در حال دریافت...</h3>
            </div>

        </section>

    </section>


    <!-- CONNECTION -->
    <section
        id="connectionBox"
        class="connection-box hidden">

        <h3>اطلاعات اتصال</h3>

        <p>
            لینک اتصال شما:
        </p>

        <div class="vpn-link">

            <span id="vpnLink">
                سرویس فعالی وجود ندارد
            </span>

        </div>

        <button onclick="copyVPN()">
            کپی لینک
        </button>

    </section>


    <!-- NAVIGATION -->
    <nav class="bottom-nav">

        <button
            class="nav-item active-nav"
            id="navHome"
            onclick="showPage('home')">

            <span>⌂</span>
            خانه

        </button>


        <button
            class="nav-item"
            id="navServices"
            onclick="showPage('services')">

            <span>▣</span>
            سرویس‌ها

        </button>


        <button
            class="nav-item"
            id="navAccount"
            onclick="showPage('account')">

            <span>👤</span>
            حساب

        </button>

    </nav>

</div>


<script src="app.js"></script>

</body>
</html>
